name: RetailOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retailos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: TypeScript and production builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run change-scoped preflight
        run: npm run preflight -- --scope=auto

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive and runtime evidence tests against the Pages build
        run: npm run test:browser
