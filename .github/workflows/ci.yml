name: RetailOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retailos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: TypeScript and production builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run local-equivalent preflight
        run: npm run preflight
